<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Juego del Marrano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,700;1,700&family=Creepster&display=swap" rel="stylesheet">
<style>
:root{--red:#c1121f}
html,body{margin:0;height:100%;background:#000;color:#eee;font-family:'Comic Neue',cursive;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;background:#000;overflow:hidden;cursor:pointer}
#scene,#scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* globo de cómic */
#bub{position:absolute;display:none;background:#fff;color:#111;border:3px solid #000;border-radius:22px;padding:.4em .9em .5em;font-weight:700;font-size:clamp(12px,2.3vw,24px);line-height:1.18;max-width:44%;min-width:12%;transform:translateX(-50%);box-shadow:4px 5px 0 rgba(0,0,0,.35);z-index:3}
#bub:before{content:'';position:absolute;left:50%;bottom:-21px;transform:translateX(-50%);border-left:12px solid transparent;border-right:12px solid transparent;border-top:20px solid #000}
#bub:after{content:'';position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);border-left:8px solid transparent;border-right:8px solid transparent;border-top:14px solid #fff}
#bub .w{display:block;font-size:.6em;letter-spacing:1px;color:#2f6db0}
#bub[data-w="EL MARRANO"] .w{color:var(--red)}
#bub[data-w="JUAN PABLO"] .w{color:#2f8a3e}
/* recuadro de narración */
#cap{position:absolute;left:2.5%;top:3.5%;max-width:62%;background:#ffe25e;color:#111;border:3px solid #000;padding:.3em .8em .4em;font-weight:700;font-style:italic;font-size:clamp(12px,2.2vw,22px);box-shadow:4px 5px 0 rgba(0,0,0,.35);display:none;z-index:3}
#cap.low{top:auto;bottom:18.5%}
#cap.center{left:50%;top:50%;transform:translate(-50%,-50%);background:none;border:0;box-shadow:none;color:#fff;font-size:clamp(16px,3.4vw,36px);text-align:center;max-width:80%}

#dark{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#dark.flick{animation:flick 1.4s linear}
@keyframes flick{0%{opacity:0}8%{opacity:.95}14%{opacity:.1}22%{opacity:.9}30%{opacity:0}48%{opacity:.85}55%{opacity:.2}62%{opacity:.95}100%{opacity:0}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#stage.shake{animation:shake .5s linear 2}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(5px,5px)}}
.spin{animation:spin 9s linear infinite;transform-box:fill-box;transform-origin:center}
.spinr{animation:spin 6s linear infinite reverse;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.flk{animation:flk 3s infinite}
@keyframes flk{0%,100%{opacity:1}42%{opacity:1}44%{opacity:.25}46%{opacity:1}48%{opacity:.4}50%{opacity:1}}
#jaw{transform-box:fill-box}
#stage.talk #jaw{animation:jaw .16s infinite alternate}
@keyframes jaw{to{transform:translateY(9px)}}
.broom{animation:broom 2.4s ease-in-out infinite alternate}
@keyframes broom{from{transform:translateX(40px)}to{transform:translateX(0)}}
.sweat{animation:sweat 1.2s ease-in infinite}
@keyframes sweat{from{transform:translateY(0);opacity:1}to{transform:translateY(18px);opacity:0}}
.bob{animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px)}}
.blink{animation:bl 1s steps(2) infinite}
/* animaciones de los personajes (parpadeo, boca, respirar, teclear, caminar, temblar) */
.eyes{animation:eyes 4.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes eyes{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.mo{opacity:0}
.mouth{transform-box:fill-box;transform-origin:center}
#stage.tk-juan .juan .mo,#stage.tk-jp .jp .mo{animation:mo .24s steps(1) infinite}
@keyframes mo{0%{opacity:1}50%{opacity:0}}
#stage.tk-juan .juan .mouth,#stage.tk-jp .jp .mouth{animation:mth .13s infinite alternate}
@keyframes mth{to{transform:scaleY(.4)}}
.breathe{animation:breathe 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scaleY(1.02)}}
.tap1{animation:tap .17s infinite alternate}.tap2{animation:tap .17s infinite alternate-reverse}
@keyframes tap{to{transform:translateY(-5px)}}
.tremble{animation:trem .11s infinite alternate}
@keyframes trem{to{transform:translate(1.5px,-1px)}}
.legL,.legR,.armL,.armR{transform-box:fill-box;transform-origin:50% 0}
#stage.walking .legL,#stage.walking .armR{animation:swing .3s infinite alternate}
#stage.walking .legR,#stage.walking .armL{animation:swing .3s infinite alternate-reverse}
@keyframes swing{from{transform:rotate(-15deg)}to{transform:rotate(15deg)}}
#stage.walking .breathe{animation:wbob .15s infinite alternate}
.beltItem{animation:belt 6.4s linear infinite}
@keyframes belt{from{transform:translateX(150px)}to{transform:translateX(650px)}}
.duckRow{animation:duck 4s linear infinite}
.paused .broom,.paused .tremble{animation-play-state:paused}
@keyframes duck{from{transform:translateX(-40px)}to{transform:translateX(640px)}}
@keyframes wbob{to{transform:translateY(-4px)}}
@keyframes bl{50%{opacity:0}}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:5}
#title{background:radial-gradient(ellipse at center,#2a0306 0%,#000 70%)}
#title .pre{font-size:clamp(12px,2vw,20px);letter-spacing:4px;color:#aaa}
#title h1{font-family:'Creepster',cursive;font-weight:400;font-size:clamp(34px,8vw,92px);margin:.1em 0 0;color:var(--red);text-shadow:0 0 30px rgba(193,18,31,.6);letter-spacing:3px}
#title h2{font-family:'Creepster',cursive;font-weight:400;font-size:clamp(20px,4vw,46px);margin:0 0 .6em;color:#e9e1d0}
button.big{font-family:'Comic Neue',cursive;font-weight:700;font-size:clamp(16px,2.6vw,28px);background:var(--red);color:#fff;border:3px solid #000;border-radius:10px;padding:.4em 1.5em;cursor:pointer;box-shadow:4px 5px 0 rgba(0,0,0,.5)}
button.big:active{transform:translate(2px,2px)}
#title p{font-size:clamp(11px,1.6vw,16px);color:#999;margin-top:1.2em}
#final{display:none;background:rgba(0,0,0,.62)}
#final .t1{font-size:clamp(14px,2.8vw,30px);font-weight:700;color:#fff;-webkit-text-stroke:1px #000}
#clock{font-family:'Creepster',cursive;font-size:clamp(70px,17vw,190px);color:var(--red);line-height:1;text-shadow:0 0 30px rgba(193,18,31,.7),4px 4px 0 #000}
#final .t2{font-size:clamp(13px,2.2vw,24px);color:#ddd;margin:.3em 0 1em}
#mute{position:absolute;top:8px;right:8px;z-index:6;font-family:inherit;background:rgba(0,0,0,.55);color:#ddd;border:2px solid #000;border-radius:8px;padding:3px 9px;font-size:clamp(12px,1.6vw,16px);cursor:pointer}
#skip{position:absolute;right:1.6%;bottom:2.4%;z-index:6;font-family:inherit;font-weight:700;background:#3dbb3d;color:#fff;border:3px solid #000;border-radius:8px;padding:2px 10px;font-size:clamp(11px,1.6vw,17px);cursor:pointer;-webkit-text-stroke:.5px #000;box-shadow:2px 3px 0 rgba(0,0,0,.5)}
button.link{margin-top:.8em;background:none;border:0;color:#ccc;text-decoration:underline;font-family:inherit;font-weight:700;font-size:clamp(12px,1.8vw,18px);cursor:pointer}
#hud{position:absolute;top:2%;left:50%;transform:translateX(-50%);display:none;z-index:4;text-align:center;pointer-events:none}
#gclock{font-family:'Creepster',cursive;font-size:clamp(26px,5vw,54px);color:#ff2a2a;text-shadow:3px 3px 0 #000;line-height:1}
#gclock.low{animation:bl .5s steps(2) infinite}
#pbarw{width:clamp(120px,24vw,260px);height:clamp(9px,1.5vw,15px);background:#222;border:2px solid #000;border-radius:8px;overflow:hidden;margin:3px auto 0}
#pbar{height:100%;width:0;background:linear-gradient(90deg,#d9b07a,#c1121f);transition:width .9s linear}
#hud small{display:block;font-weight:700;font-size:clamp(9px,1.3vw,14px);color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
#panel{position:absolute;inset:0;z-index:7;display:none;background:rgba(0,0,0,.78);align-items:center;justify-content:center}
#panel .inner{width:84%;position:relative;text-align:center}
#panel svg{width:100%;height:auto;display:block}
#pclose{margin-top:1.5%;font-size:clamp(13px,2vw,22px);padding:.25em 1.2em}
.kp{display:inline-block;background:#333;border:4px solid #000;border-radius:16px;padding:2% 3%;box-shadow:5px 6px 0 rgba(0,0,0,.5)}
.kpt{color:#ddd;font-weight:700;font-size:clamp(13px,2vw,22px)}
#kpd{background:#1a2a1a;color:#4dd84d;font-family:monospace;font-size:clamp(24px,5vw,52px);padding:.1em .5em;margin:.25em 0;border:3px solid #000;border-radius:8px;letter-spacing:4px}
.kpg{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(4px,1vw,10px)}
.kpg button{font-family:inherit;font-weight:700;font-size:clamp(16px,3vw,30px);padding:.15em .6em;background:#c9ccd1;border:3px solid #000;border-radius:8px;cursor:pointer}
.kpg button:active{background:#ffe25e}
#kpm{min-height:1.4em;font-weight:700;font-size:clamp(13px,2vw,20px);margin-top:.3em}
.kpg1{display:flex;justify-content:center;margin-top:.4em}
.kpg1 button,.chg button,.sqg button{font-family:inherit;font-weight:700;font-size:clamp(14px,2.4vw,26px);padding:.2em .8em;background:#c9ccd1;border:3px solid #000;border-radius:8px;cursor:pointer}
.ltw{display:flex;gap:clamp(4px,1vw,12px);justify-content:center;margin:.3em 0}
.lt{display:flex;flex-direction:column;align-items:center;gap:4px}
.lt button{font-size:clamp(12px,2vw,20px);background:#c9ccd1;border:3px solid #000;border-radius:6px;cursor:pointer;width:2.4em}
.ltc{background:#1a2a1a;color:#4dd84d;font-family:monospace;font-size:clamp(24px,4.5vw,48px);width:1.4em;text-align:center;border:3px solid #000;border-radius:8px}
.sqd{display:flex;gap:6px;justify-content:center;margin:.4em 0;min-height:16px}.sqd span{width:16px;height:16px;border-radius:50%;background:#555;border:2px solid #000}.sqd span.on{background:#4dd84d}
.sqg{display:flex;gap:clamp(6px,1.4vw,14px);justify-content:center}.sqg button{width:clamp(48px,9vw,90px);height:clamp(48px,9vw,90px);border-radius:50%;color:#fff;text-shadow:1px 1px 0 #000}
.lvw{display:flex;gap:clamp(6px,1.4vw,14px);justify-content:center;margin:.4em 0}
.lv{width:clamp(40px,7vw,64px);height:clamp(90px,16vw,140px);background:#555;border:3px solid #000;border-radius:10px;position:relative;cursor:pointer}
.lv span{position:absolute;left:20%;right:20%;height:38%;bottom:6%;background:#c1121f;border:3px solid #000;border-radius:8px;transition:bottom .15s}
.lv.up span{bottom:56%;background:#4dd84d}.lv b{position:absolute;top:-1.4em;left:0;right:0;color:#fff;font-size:clamp(11px,1.6vw,16px)}
.chg{display:grid;gap:clamp(6px,1.2vw,12px);margin:.5em 0}
.clk{width:clamp(140px,26vw,260px);margin:.3em auto}
.crg{width:clamp(180px,32vw,320px);margin:.3em auto}
#wcard{background:radial-gradient(ellipse at center,#5a1a8a 0%,#14001f 75%);z-index:8;cursor:pointer}
#wcard .wc-n{font-family:'Creepster',cursive;font-size:clamp(30px,7vw,80px);color:#ffe25e;text-shadow:4px 4px 0 #000}
#wcard .wc-t{font-family:'Creepster',cursive;font-size:clamp(26px,6vw,64px);color:#fff;text-shadow:4px 4px 0 #000}
#wcard .wc-s{font-weight:700;font-size:clamp(13px,2.2vw,22px);color:#e8d8ff;max-width:80%;margin-top:.6em}
#wcard .wc-h{margin-top:1.4em;color:#aaa;font-size:clamp(11px,1.6vw,15px);animation:bl 1s steps(2) infinite}
#end{display:none;background:rgba(0,0,0,.8)}
#end .t1{font-family:'Creepster',cursive;font-size:clamp(28px,6vw,70px);color:#ff2a2a;text-shadow:3px 3px 0 #000}
#end.win .t1{color:#4dd84d}
#end .t2{font-size:clamp(13px,2.3vw,24px);color:#eee;max-width:80%;margin:.4em auto 1em}
#end button{margin:.3em}
#ftimer{position:absolute;top:3%;left:50%;transform:translateX(-50%);z-index:6;display:none;font-family:'Creepster',cursive;font-size:clamp(40px,9vw,100px);color:#ff2a2a;text-shadow:4px 4px 0 #000,0 0 24px rgba(255,0,0,.7);pointer-events:none;line-height:1}
#ftimer:before{content:'⏱ ';font-size:.6em}
#ftimer.low{animation:bl .4s steps(2) infinite}
#fvig{position:absolute;inset:0;z-index:3;display:none;pointer-events:none;box-shadow:inset 0 0 120px 40px rgba(255,0,0,.55);animation:vig 1s ease-in-out infinite alternate}
@keyframes vig{from{opacity:.5}to{opacity:1}}
.fatk{animation:trem .09s infinite alternate}
#kill{display:none;z-index:9;background:#000}
#kill svg{position:absolute;inset:0;width:100%;height:100%}
.lunge{animation:lunge .7s cubic-bezier(.2,1.6,.4,1) both}
@keyframes lunge{from{transform:translateX(320px) scale(.6)}to{transform:none}}
.boom{animation:boom .5s .45s cubic-bezier(.2,1.8,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes boom{from{transform:scale(0)}to{transform:scale(1)}}
#endH{display:none;background:#ffe25e;color:#111;border:3px solid #000;border-radius:10px;padding:.4em .9em;font-weight:700;font-size:clamp(13px,2.2vw,22px);max-width:78%;margin:0 auto 1em;box-shadow:4px 5px 0 rgba(0,0,0,.5)}
/* más animación: Juan salta al recoger, niega con la cabeza, se inclina al caminar; polvo; brillo al pasar el ratón */
#stage.pick .juan .breathe{animation:hop .45s ease-out}
@keyframes hop{30%{transform:translateY(-16px) scaleY(1.04)}60%{transform:translateY(0) scaleY(.94)}}
#stage.nope .juan .breathe{animation:nope .5s ease-in-out}
@keyframes nope{20%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}80%{transform:rotate(-4deg)}}
#pjl{transition:transform .2s}
.fidle{animation:fidle 1.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fidle{to{transform:scale(1.03,1.05)}}
.mote{animation:mote 9s linear infinite;opacity:0}
@keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.55}85%{opacity:.4}100%{transform:translate(30px,-90px);opacity:0}}
#scene.enter{animation:enter .4s ease-out}
@keyframes enter{from{opacity:.25;transform:scale(1.05)}to{opacity:1;transform:none}}
.sparkle{animation:sparkle .6s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes sparkle{from{transform:scale(.2);opacity:1}to{transform:scale(1.8);opacity:0}}
@media (hover:hover){[data-hs]:hover{filter:brightness(1.2) drop-shadow(0 0 5px rgba(255,255,255,.7))}}
#rot{display:none}
@media (orientation:portrait) and (max-width:700px){#rot{display:block;position:fixed;left:0;right:0;bottom:12%;text-align:center;color:#888;font-size:14px}}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="scene"></div>
    <div id="dark"></div>
    <div id="flash"></div>
    <div id="bub"><span class="w"></span><span id="btx"></span></div>
    <div id="cap"><span id="ctx"></span></div>
    <button id="mute" title="Sonido">🔊</button>
    <button id="skip" title="Saltar">SALTAR ⏭</button>
    <div id="title" class="overlay">
      <div class="pre">UN JUEGO PARA</div>
      <h1>JUAN ATENCIA</h1>
      <h2>El Juego del Marrano</h2>
      <button class="big" id="play">▶ JUGAR</button>
      <button class="big" id="contTitle" style="display:none;margin-top:.5em;background:#2f8a3e">⏩ Continuar partida</button>
      <p>Toca la pantalla para avanzar · Sube el volumen 🔊</p>
    </div>
    <div id="final" class="overlay">
      <div class="t1">¡SALVA A JUAN PABLO!</div>
      <div id="clock">🐷</div>
      <div class="t2">NIVEL 1 · El sótano del Marrano</div>
      <button class="big" id="playgame">▶ ¡A JUGAR!</button>
      <button class="big" id="contgame" style="display:none;margin-top:.5em;background:#2f8a3e">⏩ Continuar partida</button>
      <button class="link" id="again">↺ Ver la intro otra vez</button>
    </div>
    <div id="hud"><div id="gclock">05:00</div><div id="pbarw"><div id="pbar"></div></div><small>🧹 el palo se acerca a Juan Pablo</small></div>
    <div id="panel"><div class="inner"><div id="pcontent"></div><button class="big" id="pclose">✕ Salir</button></div></div>
    <div id="end" class="overlay"><div class="t1" id="endT"></div><div class="t2" id="endS"></div><div id="endH"></div><div id="endB"></div></div>
  </div>
</div>
<div id="rot">📱 Gira el móvil para verlo más grande</div>

<script>
/* ================= DIBUJOS (estilo cómic: colores planos + contorno negro) ================= */
const SKIN='#e2a96e', SKIN_D='#b9824d';
const K='stroke="#000" stroke-width="3" stroke-linejoin="round"';
const K2='stroke="#000" stroke-width="2" stroke-linejoin="round"';
/* Juan: pelo corto rapado a los lados, gafas, camiseta clara de baloncesto, short oscuro */
const JUAN={fade:true,glasses:true,round:true,hair:'#141010',skin:'#f6d6bd'}, JUAN_SHIRT='#ece4cc';
/* Juan Pablo: pelo ondulado con volumen, piel clara, camiseta negra */
const JP_SKIN='#f0c8a8';
const WALK_X=170, WALK_T=2.4;
function ballLogo(x,y,s=1){
  return `<g transform="translate(${x},${y}) scale(${s})">
   <rect x="-13" y="-17" width="26" height="12" fill="none" stroke="#c1121f" stroke-width="2.5"/>
   <path d="M-8 -5 L-6 4 M0 -5 V5 M8 -5 L6 4" stroke="#999" stroke-width="1.5"/>
   <circle cx="2" cy="7" r="10" fill="#f08a24" ${K2}/>
   <path d="M-8 7 H12 M2 -3 V17 M-5 0 Q2 7 -5 14 M9 0 Q2 7 9 14" stroke="#000" stroke-width="1.5" fill="none"/></g>`;
}

function headFront(o={}){
  const e=o.expr||'normal', lx=o.look||0;
  let eyes,mouth,brows;
  if(e==='scared'){
    eyes=`<circle cx="-11" cy="0" r="8" fill="#fff" ${K2}/><circle cx="11" cy="0" r="8" fill="#fff" ${K2}/><circle cx="${-11+lx}" cy="1" r="2.8" fill="#000"/><circle cx="${11+lx}" cy="1" r="2.8" fill="#000"/>`;
    brows=`<path d="M-20 -15 L-5 -12 M20 -15 L5 -12" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>`;
    mouth=`<ellipse cx="0" cy="18" rx="7" ry="9" fill="#5a0d0d" ${K2}/>`;
  }else if(e==='dizzy'){
    eyes=`<path d="M-16 0 Q-11 -4 -6 0 M6 0 Q11 -4 16 0" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    brows=`<path d="M-18 -10 L-5 -7 M18 -10 L5 -7" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>`;
    mouth=`<path d="M-7 18 Q0 14 7 18" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  }else{
    eyes=`<ellipse cx="-11" cy="0" rx="6" ry="7" fill="#fff" ${K2}/><ellipse cx="11" cy="0" rx="6" ry="7" fill="#fff" ${K2}/><circle cx="${-11+lx}" cy="1" r="2.8" fill="#000"/><circle cx="${11+lx}" cy="1" r="2.8" fill="#000"/>`;
    brows=`<path d="M-17 -11 L-5 -11 M17 -11 L5 -11" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>`;
    mouth=`<path d="M-8 16 Q0 22 8 16" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  }
  return `
  <circle cx="${o.round?-34:-31}" cy="3" r="7" fill="${o.skin||SKIN}" ${K}/><circle cx="${o.round?34:31}" cy="3" r="7" fill="${o.skin||SKIN}" ${K}/>
  ${o.round?`<ellipse rx="35" ry="32" cy="1" fill="${o.skin||SKIN}" ${K}/>`:`<circle r="31" fill="${o.skin||SKIN}" ${K}/>`}
  ${o.cap?`<path d="M-32 -4 Q-33 -43 0 -43 Q33 -43 32 -4 Q16 -15 0 -15 Q-16 -15 -32 -4Z" fill="${o.cap}" ${K}/><path d="M-12 -40 Q0 -46 12 -40" stroke="#fff" stroke-width="3" fill="none"/>`
         :o.fade?`<path d="M-31 2 Q-34 -26 -26 -30 Q-12 -38 0 -38 Q12 -38 26 -30 Q34 -26 31 2 Q28 -14 22 -18 Q0 -26 -22 -18 Q-28 -14 -31 2Z" fill="${o.hair||'#1d1712'}" opacity=".35"/>

function floorTiles(y0,y1,vx,vy){
  let s='';
  for(let x=-800;x<=1600;x+=90){const k=(y0-vy)/(y1-vy);s+=`M${vx+(x-vx)*k} ${y0}L${x} ${y1}`}
  let y=y0,h=14;while(y<y1){y+=h;h*=1.35;s+=`M0 ${Math.min(y,y1)}H800`}
  return `<path d="${s}" stroke="#a9a9a9" stroke-width="2" fill="none"/>`;
}

function burst(cx,cy,n,r1,r2){
  let p=[];for(let k=0;k<n*2;k++){const a=k*Math.PI/n,r=k%2?r2:r1;p.push((cx+Math.cos(a)*r).toFixed(1)+','+(cy+Math.sin(a)*r).toFixed(1))}
  return p.join(' ');
}

let AC=null, master=null, muted=false, drone=null;
function ac(){
  if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination)}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,d,o={}){
  const a=ac(),t=a.currentTime+(o.delay||0),os=a.createOscillator(),g=a.createGain();
  os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);
  if(o.slide)os.frequency.exponentialRampToValueAtTime(o.slide,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(o.g??.2,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  os.connect(g).connect(master);os.start(t);os.stop(t+d+.05);
}
let NB=null;
function noise(d,o={}){
  const a=ac(),t=a.currentTime+(o.delay||0);
  if(!NB){NB=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const c=NB.getChannelData(0);for(let k=0;k<c.length;k++)c[k]=Math.random()*2-1}
  const s=a.createBufferSource();s.buffer=NB;s.loop=true;
  const f=a.createBiquadFilter();f.type=o.type||'lowpass';f.frequency.value=o.f||1000;f.Q.value=o.q||1;
  const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(o.g??.3,t+(o.a||.01));g.gain.linearRampToValueAtTime(0,t+d);
  s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+d+.05);
}
const SFX={
  tick(){for(let k=0;k<6;k++)tone(1100+Math.random()*500,.03,{type:'square',g:.02,delay:k*.12+Math.random()*.05})},
  clank(){tone(330,.5,{type:'square',g:.12,slide:170});tone(523,.4,{type:'triangle',g:.12});noise(.2,{type:'highpass',f:2500,g:.35})},
  thud(){tone(95,.6,{g:.7,slide:35});noise(.25,{f:300,g:.6})},
  heart(){[0,.22,1,1.22,2,2.22].forEach(t=>tone(58,.2,{g:.7,slide:38,delay:t}))},
  sting(){tone(233,1.6,{type:'sawtooth',g:.07});tone(247,1.6,{type:'sawtooth',g:.07});tone(466,1.6,{type:'sawtooth',g:.05});noise(1,{type:'highpass',f:3000,g:.08})},
  scream(){noise(1.1,{type:'bandpass',f:1700,q:4,g:.45});tone(760,1.1,{type:'sawtooth',g:.07,slide:480})},
  drag(){noise(2,{type:'bandpass',f:350,q:.7,g:.35,a:.3})},
  door(){tone(130,.9,{type:'square',g:.1,slide:55});noise(.5,{f:500,g:.6});tone(70,.8,{g:.4,slide:40})},
  laugh(){[0,.22,.44,.66,.88].forEach((t,k)=>tone(190-k*12,.16,{type:'sawtooth',g:.09,slide:140-k*10,delay:t}))},
  buzz(){tone(60,1.6,{type:'sawtooth',g:.04});tone(120,1.6,{type:'square',g:.015})},
  chain(){for(let k=0;k<7;k++){tone(1800+Math.random()*1800,.09,{type:'triangle',g:.08,delay:k*.08});noise(.05,{type:'highpass',f:4000,g:.15,delay:k*.08})}},
  static(){noise(1.2,{type:'highpass',f:1400,g:.18})},
  off(){tone(1500,.35,{g:.1,slide:60})},
  type(){tone(1300+Math.random()*300,.02,{type:'square',g:.012})},
  clock(){tone(1000,.05,{type:'square',g:.05})}
};
function startDrone(){
  if(drone)return;const a=ac();drone=a.createGain();drone.gain.value=.035;
  const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=220;
  [55,58.3,82.4].forEach(fr=>{const o=a.createOscillator();o.type='sawtooth';o.frequency.value=fr;o.connect(f);o.start()});
  f.connect(drone).connect(master);
}
function speak(t){
  if(muted||!('speechSynthesis' in window))return;
  try{
    const u=new SpeechSynthesisUtterance(t.replace(/\.\.\./g,', '));
    const v=speechSynthesis.getVoices().find(v=>/^es/i.test(v.lang));
    if(v)u.voice=v;u.lang=v?v.lang:'es-ES';u.pitch=.1;u.rate=.82;
    speechSynthesis.speak(u);
  }catch(e){}
}

function exitLock(to){
  const f=G.f;
  if(to==='vigilancia'&&G.room==='calderas'&&!f.breaker)return 'Esta puerta es eléctrica y no tiene energía. Ese panel de luces de la pared debe tener algo que ver.';
  if(to==='taller'&&!f.rata)return 'La rata no me deja pasar al taller.';
  if(to==='oficina'&&!f.pc)return 'Cerrada electrónicamente. Tal vez se abre desde el ordenador.';
  return null;
}

function newGame(){

     f:{},seen:{celda:1},t:0,over:false,tvon:false,gears:[3,7,1],gang:null};

}
function snap(){return JSON.stringify({world:G.world??1,room:G.room,x:G.x,y:G.y,chained:G.chained,inv:G.inv,f:G.f,seen:G.seen,gears:G.gears})}
function loadSnap(js){const o=JSON.parse(js);Object.assign(G,o,{tx:o.x,ty:o.y,walking:false,cb:null,sel:null,gang:null,over:false,tvon:false,fight:null})}
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({cp:G.cp,t:G.t}))}catch(e){}}
function readSave(){try{return JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch(e){return null}}

const depth=y=>.95*(.8+.2*Math.max(0,Math.min(1,(y-300)/72)));
function ankle(){const s=depth(G.y);return [G.x-12*s,G.y-12*s]}
function chained(){return G.room==='celda'&&G.chained}
function chainD(){
  const [ax,ay]=ankle();
  const [ex,ey]=chained()?[RING.x,RING.y]:[ax-70,ay+10];
  const mx=(ax+ex)/2, my=Math.max(ay,ey)+(chained()?Math.max(4,40-Math.hypot(ax-ex,ay-ey)/8):6);
  return `M${ax.toFixed(1)} ${ay.toFixed(1)} Q${mx.toFixed(1)} ${my.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`;
}

function gPlace(){
  const pj=document.getElementById('pj');if(!pj)return;
  if(!isFinite(G.x)||!isFinite(G.y)){const s=(ROOMS[G.room]&&ROOMS[G.room].start)||[400,360];G.x=G.tx=s[0];G.y=G.ty=s[1];G.walking=false;stage.classList.remove('walking')}
  pj.setAttribute('transform',`translate(${G.x.toFixed(1)},${G.y.toFixed(1)}) scale(${depth(G.y).toFixed(3)})`);
  const d=chainD();document.getElementById('ch1').setAttribute('d',d);document.getElementById('ch2').setAttribute('d',d);
  const lm=document.getElementById('lmc');if(lm){lm.setAttribute('cx',G.x.toFixed(1));lm.setAttribute('cy',(G.y-90).toFixed(1))}
}
function clampPos(x,y){
  y=Math.max(302,Math.min(372,y));
  const xl=150-(y-290)*150/90+30, xr=650+(y-290)*150/90-30;
  x=Math.max(xl,Math.min(xr,x));
  if(chained()){
    const s=depth(y),ax=x-12*s,ay=y-12*s,dx=ax-RING.x,dy=ay-RING.y,d=Math.hypot(dx,dy);
    if(d>CHAIN_MAX){x=RING.x+dx/d*CHAIN_MAX+12*s;y=Math.max(302,Math.min(372,RING.y+dy/d*CHAIN_MAX+12*s))}
  }
  return [x,y];
}
function walkTo(x,y,cb){
  if(!isFinite(x)||!isFinite(y)){x=G.x;y=G.y}
  if(!isFinite(G.x)||!isFinite(G.y)){const s=(ROOMS[G.room]&&ROOMS[G.room].start)||[400,360];G.x=G.tx=s[0];G.y=G.ty=s[1]}
  const [cx,cy]=clampPos(x,y);
  G.tx=cx;G.ty=cy;G.cb=cb||null;G.want=[x,y];
  if(G.walking)return;
  G.walking=true;stage.classList.add('walking');
  if(started)SFX.chain();
  let last=performance.now();
  const step=now=>{
    if(!G||G.over){if(G)G.walking=false;stage.classList.remove('walking');return}
    const dt=Math.min(.05,(now-last)/1000);last=now;
    const dx=G.tx-G.x,dy=G.ty-G.y,d=Math.hypot(dx,dy),v=190*dt;
    if(d<=v){
      G.x=G.tx;G.y=G.ty;gPlace();G.walking=false;stage.classList.remove('walking');
      const pl=document.getElementById('pjl');if(pl)pl.setAttribute('transform','rotate(0)');
      const c=G.cb;G.cb=null;if(c)c(Math.hypot(G.want[0]-G.x,G.want[1]-G.y));return;
    }
    const sg=Math.abs(dx)>4?Math.sign(dx):0;
    if(sg&&sg*3!==G.look){G.look=sg*3;G.lean=sg*4;const h=document.getElementById('pjh');if(h)h.innerHTML=juanBody()}
    const pl=document.getElementById('pjl');if(pl)pl.setAttribute('transform',`rotate(${G.lean||0})`);
    G.x+=dx/d*v;G.y+=dy/d*v;gPlace();gRaf=requestAnimationFrame(step);
  };
  gRaf=requestAnimationFrame(step);
}
function changeRoom(to){
  const from=G.room;fx('flicker');
  setTimeout(()=>{
    if(G.over)return;
    if(from==='bano')G.f.dollStep=0;
    if(ROOMS[from]&&ROOMS[from].leave)ROOMS[from].leave(G.f);
    const RT=ROOMS[to],back=RT.ex&&RT.ex.find(x=>x.to===from);
    const amb=FIGHTS[to]&&FIGHTS[to].ambush&&!G.f['fw_'+FIGHTS[to].id]?FIGHTS[to]:null;
    if(amb)G.cp=snap();
    G.room=to;let e=back&&back.at?back.at:((ENTRY[to]||{})[from]||RT.start||[400,360]);if(!isFinite(e[0])||!isFinite(e[1]))e=[400,360];G.x=G.tx=e[0];G.y=G.ty=e[1];G.sel=null;
    if(RT.enter)RT.enter(G.f);
    const first=!G.seen[to];G.seen[to]=1;if(!amb)G.cp=snap();saveGame();gRender();
    if(amb){setTimeout(()=>{if(!G.over&&G.room===to)startFight(amb)},650);return}
    const sc=$('#scene');sc.classList.remove('enter');void sc.offsetWidth;sc.classList.add('enter');
    if(first&&ROOM_INTRO[to])setTimeout(()=>say(ROOM_INTRO[to]),400);
    if(first&&ROOM_TAUNT[to])setTimeout(()=>{if(!G.over&&!G.fight&&G.room===to)tvSay(...ROOM_TAUNT[to])},4200);
  },250);
}

function flyItem(it,k){
  const sv=$('#scene svg');if(!sv||!ITEMS[it])return;

  g.innerHTML=`<circle r="22" fill="#fff6a8" opacity=".55"/>${ITEMS[it].icon}`;sv.appendChild(g);
  const t0=performance.now(),D=700;
  const f=now=>{const t=Math.min(1,(now-t0)/D),e=t*t*(3-2*t),x=x0+(x1-x0)*e,y=y0+(y1-y0)*e-Math.sin(t*Math.PI)*90,sc=1.8-.8*e;

function useHotspot(id){
  if(id==='enemy')return fightUse();
  if(id==='invpage'){G.page=(G.page||0)+1;if(G.page*9>=G.inv.length)G.page=0;return gRender()}
  if(G.fight&&(id.startsWith('go:')||id==='tohub'))return say('¡No puedo huir! ¡Me alcanza! ¡Tengo que usar algo!',1800);
  if(id==='tohub')return travelHub();
  if(id.startsWith('go:')&&ROOMS[G.room].ex){
    const to=id.slice(3),e=ROOMS[G.room].ex.find(x=>x.to===to);if(!e)return;
    return walkTo(e.at[0],e.at[1],()=>{
      if(G.over)return;const lock=e.lock?e.lock(G.f):null;
      if(lock&&lock.die)return die(lock.die);if(lock)return say(lock);changeRoom(to)});
  }
  if(id.startsWith('go:')){
    const to=id.slice(3), at=(ARROW_AT[id]||{})[G.room]||[G.x,G.y];
    const lock=exitLock(to);
    return walkTo(at[0],at[1],()=>{if(G.over)return;if(lock)return say(lock);changeRoom(to)});
  }
  if(id==='map')return showMap();
  const h=(HS[G.room]||{})[id];if(!h)return;
  const at=typeof h.at==='function'?h.at():h.at;
  walkTo(at[0],at[1],miss=>{
    if(G.over)return;
    if(miss>45&&chained())return say('¡La cadena no me deja llegar hasta allá!');
    if(ROOMS[G.room].pitch&&!G.inv.includes('linternaOn'))return say('Está demasiado oscuro. No veo nada.');
    if(G.sel&&!(h.uses||[]).includes(G.sel)){G.sel=null;gRender();anim('nope');return say('Eso no sirve aquí.')}
    h.do();
    if(G.sel&&!G.over){G.sel=null;gRender()}
    if(G.room==='bano'&&!h.noTick)dollTick();
  });
}
/* el muñeco del baño se acerca cada vez que Juan hace algo */
function dollTick(){
  const f=G.f;if(f.munecoTapado||G.over)return;
  f.dollStep=(f.dollStep||0)+1;
  setTimeout(()=>{
    if(G.over||G.room!=='bano')return;gRender();if(started)tone(90,.4,{type:'sawtooth',g:.12,slide:60});
    if(f.dollStep===2)say('...¿Ese muñeco se movió?',2200);
    if(f.dollStep===3)say('¡SE ESTÁ ACERCANDO! ¡Tengo que taparle los ojos con algo!',2600);
    if(f.dollStep>=4)setTimeout(()=>die('muneco'),600);
  },2600);
}
function selectItem(k){
  const it=G.inv[k];if(!it)return;
  if(G.sel&&G.sel!==it){
    const r=RECIPES.find(r=>(r.a===G.sel&&r.b===it)||(r.b===G.sel&&r.a===it));
    G.sel=null;
    if(!r){gRender();return say('Eso no se puede combinar.')}
    r.gone.forEach(drop);give(r.out);return say(r.say);
  }
  G.sel=G.sel===it?null:it;gRender();
  if(G.sel)say(`${ITEMS[it].n}. Toca dónde usarlo o con qué combinarlo.`,2600);
}
function gClick(e){
  if($('#panel').style.display==='flex')return;
  const inv=e.target.closest('[data-inv]');if(inv)return selectItem(+inv.dataset.inv);
  const hs=e.target.closest('[data-hs]');if(hs)return useHotspot(hs.dataset.hs);
  const el=$('#scene svg');const pt=el.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
  const p=pt.matrixTransform(el.getScreenCTM().inverse());
  if(p.y<286||p.y>=380)return;
  const tr=(TRAPS[G.room]||[]).find(t=>p.x>=t.x1&&p.x<=t.x2&&p.y>=t.y1&&p.y<=t.y2);
  walkTo(p.x,p.y,tr?()=>{if(!G.over)die(tr.death)}:null);
}

function doorR(fill,label,extra){return `<path d="M690 306 L690 130 Q726 112 762 124 L762 342Z" fill="${fill}" ${K}/>${label?`<rect x="698" y="100" width="58" height="18" rx="3" fill="#e9b949" ${K2}/><text x="727" y="114" text-anchor="middle" font-size="10" font-weight="700" font-family="'Comic Neue',cursive">${label}</text>`:''}${extra||''}`}
function doorL(fill,label,extra){return `<path d="M110 306 L110 130 Q74 112 38 124 L38 342Z" fill="${fill}" ${K}/>${label?`<rect x="44" y="100" width="58" height="18" rx="3" fill="#e9b949" ${K2}/><text x="73" y="114" text-anchor="middle" font-size="10" font-weight="700" font-family="'Comic Neue',cursive">${label}</text>`:''}${extra||''}`}
function doorB(x,fill,label,extra){return `<rect x="${x-40}" y="150" width="80" height="140" fill="${fill}" ${K}/><circle cx="${x+28}" cy="224" r="4" fill="#e9b949" ${K2}/>${label?`<rect x="${x-34}" y="124" width="68" height="20" rx="3" fill="#fff" ${K2}/><text x="${x}" y="139" text-anchor="middle" font-size="12" font-weight="700" font-family="'Comic Neue',cursive">${label}</text>`:''}${extra||''}`}
function txt(x,y,s,size,fill,anchor){return `<text x="${x}" y="${y}" text-anchor="${anchor||'middle'}" font-family="'Comic Neue',cursive" font-weight="700" font-size="${size||14}" fill="${fill||'#000'}">${s}</text>`}

let roomT=null;
function roomTick(){if(mode!=='game'||!G||G.over)return;
  if(!G.walking&&!G.fight&&Math.random()<.02){G.look=[-3,0,3][Math.random()*3|0];const h=document.getElementById('pjh');if(h)h.innerHTML=juanBody()}const R=ROOMS[G.room];if(R&&R.tick)R.tick(G.f);if(typeof fightCheck==='function')fightCheck()}

/* cartel de "MUNDO N" entre mundo y mundo */
function worldCard(n,cb){
  let c=document.getElementById('wcard');
  if(!c){c=document.createElement('div');c.id='wcard';c.className='overlay';stage.appendChild(c)}
  const W=WORLDS[n];
  c.innerHTML=`<div class="wc-n">MUNDO ${n}</div><div class="wc-t">${W.title}</div><div class="wc-s">${W.card||''}</div><div class="wc-h">toca para seguir</div>`;
  c.style.display='flex';if(started){SFX.sting();if(W.cardVoice)setTimeout(()=>speak(W.cardVoice),600)}
  let done=false;const go=()=>{if(done)return;done=true;c.style.display='none';try{speechSynthesis.cancel()}catch(e){}cb()};
  c.onclick=ev=>{ev.stopPropagation();go()};setTimeout(go,9000);
}
/* fin de un mundo: la tele se vuelve un portal */
function portalTo(n,line){
  if(G._pt&&Date.now()-G._pt<6000&&Date.now()>=G._pt)return;G._pt=Date.now();
  G.portal=true;gRender();if(started){SFX.static();SFX.sting()}
  if(line)tvSay('EL MARRANO',line,1);
  setTimeout(()=>{if(!G.over)say('¿Qué? ¡La tele está haciendo un remolino! ¡ME ESTÁ CHUPANDO!')},2500);
  setTimeout(()=>{
    if(G.over){G.portal=false;G._pt=0;if(G.room)gRender();return}fx('flash');fx('shake');if(started){noise(1.5,{type:'bandpass',f:500,q:.6,g:.5,a:.4});tone(200,1.5,{type:'sawtooth',g:.1,slide:1200})}
    const w=G.world;G.f['mundo'+w]=1;G.f['done'+w]=1;G.portal=false;bub.style.display='none';cap.style.display='none';
    G.inv=G.inv.filter(i=>!ITEMS[i]||ITEMS[i].w!==w||ITEMS[i].x);
    G.over=true;worldDone(w,()=>{G.over=false;goHub(w>1?HUB_LINE[w]:'')});
  },7500);
}
function startWorld(n,again){
  const W=WORLDS[n];endFight();
  G.world=n;G.sel=null;G.chained=false;G.walking=false;G.f['seenW'+n]=1;
  const r=again&&W.back?W.back:W.start,ps=again&&W.backPos?W.backPos:W.pos;
  G.room=r;G.x=G.tx=ps[0];G.y=G.ty=ps[1];G.seen[r]=1;
  G.cp=snap();saveGame();lastKey='';gRender();
  if(again)return setTimeout(()=>say('Otra vez en '+W.title.toLowerCase()+'... ¿qué me faltó aquí?',2600),600);
  if(W.arrive)setTimeout(()=>say(W.arrive),700);
  if(W.taunt)setTimeout(()=>{if(!G.over)tvSay(...W.taunt)},5500);
}
/* cartel de "MUNDO N SUPERADO" */
function worldDone(w,cb){
  let c=document.getElementById('wcard');
  if(!c){c=document.createElement('div');c.id='wcard';c.className='overlay';stage.appendChild(c)}
  c.innerHTML=`<div class="wc-n">¡MUNDO ${w} SUPERADO!</div><div class="wc-t">${WORLDS[w].title}</div><div class="wc-s">${w===1?'La tele escupe a Juan en un cuarto lleno de teles...':'De vuelta al cuarto de las teles. Se encendió un bombillo de cerdito.'} Tiempo jugado: ${fmt(G.t)}</div><div class="wc-h">toca para seguir</div>`;
  c.style.display='flex';if(started)SFX.sting();
  let done=false;const go=()=>{if(done)return;done=true;c.style.display='none';cb()};
  c.onclick=ev=>{ev.stopPropagation();go()};setTimeout(go,7000);
}
const HUB_LINE={2:'¿Saliste de mi hospital? Qué suerte... Pero sin los 4 trozos de mi corazón, Juan Pablo se queda encadenado. JE JE.',
  3:'¿Arreglaste mi carro? Qué tierno. Los trozos de mi corazón siguen escondidos... ¿o ya los tienes todos?',
  4:'¡Bravo, payaso! Cuando los 3 bombillos estén prendidos, la tele 5 te llevará a MI mente. Ahí está Juan Pablo.'};
/* irse al cuarto de las teles desde un mundo */
function travelHub(){
  say('¡Me voy al cuarto de las teles!',1400);if(started){SFX.static();tone(200,1.2,{type:'sawtooth',g:.08,slide:1200})}
  G.over=true;setTimeout(()=>{fx('flash');G.over=false;goHub()},1300);
}

/* ---------- puzles reutilizables ---------- */
const pzWin=(msg,cb)=>{if(started)SFX.door();const m=document.getElementById('pzm');if(m){m.textContent=msg||'✔ ¡CORRECTO!';m.style.color='#4dd84d'}setTimeout(()=>{$('#panel').style.display='none';cb()},900)};
const pzBad=(msg)=>{if(started)tone(150,.3,{type:'square',g:.1});const m=document.getElementById('pzm');if(m){m.textContent=msg||'✖ Incorrecto';m.style.color='#ff4d4d'}};
const beep=f=>{if(started)tone(f||700,.05,{type:'square',g:.06})};
/* candado de letras */
function openLetters(o){
  const A='ABCDEFGHIJKLMNOPQRSTUVWXYZ';const v=Array(o.len).fill(0);
  const draw=()=>v.map((x,i)=>`<div class="lt"><button data-u="${i}">▲</button><div class="ltc">${A[x]}</div><button data-d="${i}">▼</button></div>`).join('');
  panel(`<div class="kp"><div class="kpt">${o.title}</div><div class="ltw" id="ltw">${draw()}</div><div class="kpg1"><button id="ltok">OK</button></div><div id="pzm"></div></div>`);
  const bind=()=>{document.querySelectorAll('[data-u],[data-d]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();beep();
    const i=+(b.dataset.u??b.dataset.d);v[i]=(v[i]+(b.dataset.u!==undefined?1:25))%26;$('#ltw').innerHTML=draw();bind()})};bind();
  $('#ltok').onclick=ev=>{ev.stopPropagation();v.map(x=>A[x]).join('')===o.code?pzWin(null,o.onOK):pzBad()};
}
/* botones de colores en orden */
function openSequence(o){
  let seq=[];
  panel(`<div class="kp"><div class="kpt">${o.title}</div><div id="sqd" class="sqd"></div>
    <div class="sqg">${o.buttons.map(b=>`<button data-s="${b.id}" style="background:${b.color}">${b.label||''}</button>`).join('')}</div><div id="pzm"></div></div>`);
  const draw=()=>{$('#sqd').innerHTML=o.code.map((_,i)=>`<span class="${i<seq.length?'on':''}"></span>`).join('')};draw();
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();beep(400+o.buttons.findIndex(x=>x.id===b.dataset.s)*120);
    seq.push(b.dataset.s);
    if(seq[seq.length-1]!==o.code[seq.length-1]){seq=[];draw();return o.onWrong?($('#panel').style.display='none',o.onWrong()):pzBad('✖ Así no es... empieza otra vez')}
    draw();if(seq.length===o.code.length)pzWin(null,o.onOK)});
}
/* palancas arriba/abajo */
function openLevers(o){
  const v=Array(o.n).fill(0);
  const draw=()=>v.map((x,i)=>`<button class="lv ${x?'up':''}" data-lv="${i}"><span></span><b>${o.labels?o.labels[i]:i+1}</b></button>`).join('');
  panel(`<div class="kp"><div class="kpt">${o.title}</div><div class="lvw" id="lvw">${draw()}</div><div class="kpg1"><button id="lvok">${o.ok||'PROBAR'}</button></div><div id="pzm"></div></div>`);
  const bind=()=>document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();beep(300);v[+b.dataset.lv]^=1;$('#lvw').innerHTML=draw();bind()});bind();
  $('#lvok').onclick=ev=>{ev.stopPropagation();if(v.join('')===o.code)return pzWin(null,o.onOK);if(o.onWrong){$('#panel').style.display='none';return o.onWrong()}pzBad()};
}
/* elegir una opción (cables, gavetas, espejos...) */
function openChoice(o){
  panel(`<div class="kp"><div class="kpt">${o.title}</div><div class="chg" style="grid-template-columns:repeat(${o.cols||o.options.length},1fr)">${o.options.map((op,i)=>`<button data-ch="${i}" style="${op.color?'background:'+op.color:''}">${op.label}</button>`).join('')}</div><div id="pzm">${o.hint||''}</div></div>`);
  document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();beep();
    const i=+b.dataset.ch;if(i===o.correct)return pzWin(o.okMsg,o.onOK);$('#panel').style.display='none';o.onWrong(i)});
}
/* reloj: poner la hora */
function openClock(o){
  let h=12,m=0;
  const face=()=>`<svg viewBox="0 0 200 200" width="100%"><circle cx="100" cy="100" r="92" fill="#fff8dc" ${K}/>
    ${[...Array(12)].map((_,i)=>`<text x="${100+Math.sin(i*Math.PI/6)*74}" y="${108-Math.cos(i*Math.PI/6)*74}" text-anchor="middle" font-size="18" font-weight="700" font-family="'Comic Neue',cursive">${i||12}</text>`).join('')}
    <path d="M100 100 L${100+Math.sin(((h%12)+m/60)*Math.PI/6)*46} ${100-Math.cos(((h%12)+m/60)*Math.PI/6)*46}" stroke="#000" stroke-width="8" stroke-linecap="round"/>
    <path d="M100 100 L${100+Math.sin(m*Math.PI/30)*70} ${100-Math.cos(m*Math.PI/30)*70}" stroke="#c1121f" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="7" fill="#000"/></svg>`;
  panel(`<div class="kp"><div class="kpt">${o.title}</div><div id="clk" class="clk">${face()}</div>
    <div class="kpg"><button id="hm">− hora</button><button id="hp">+ hora</button><button id="ok1">OK</button><button id="mm">− min</button><button id="mp">+ min</button><span></span></div><div id="pzm"></div></div>`);
  const up=()=>{$('#clk').innerHTML=face()};
  $('#hp').onclick=e=>{e.stopPropagation();beep();h=h%12+1;up()};$('#hm').onclick=e=>{e.stopPropagation();beep();h=(h+10)%12+1;up()};
  $('#mp').onclick=e=>{e.stopPropagation();beep();m=(m+15)%60;up()};$('#mm').onclick=e=>{e.stopPropagation();beep();m=(m+45)%60;up()};
  $('#ok1').onclick=e=>{e.stopPropagation();(h===o.h&&m===o.m)?pzWin(null,o.onOK):pzBad()};
}
/* grúa: llevar el gancho hasta el objetivo sin chocar */
function openCrane(o){
  let r=o.start[0],c=o.start[1];const N=o.size;
  const wall=(a,b)=>o.walls.some(w=>w[0]===a&&w[1]===b);
  const draw=()=>{let s='';for(let a=0;a<N;a++)for(let b=0;b<N;b++){const x=b*70+10,y=a*70+10;
    s+=`<rect x="${x}" y="${y}" width="64" height="64" rx="6" fill="${wall(a,b)?'#7a2a1a':(a===o.target[0]&&b===o.target[1])?'#4dd84d':'#ccc'}" ${K2}/>`;
    if(wall(a,b))s+=`<path d="M${x+8} ${y+20}h48v24h-48z" fill="#c1121f" ${K2}/>`;
    if(a===o.target[0]&&b===o.target[1])s+=`<rect x="${x+12}" y="${y+22}" width="40" height="22" rx="4" fill="#2f6db0" ${K2}/>`;}
    s+=`<g transform="translate(${c*70+42},${r*70+42})"><path d="M0 -40 V-6" stroke="#000" stroke-width="4"/><path d="M-12 -6 Q0 18 12 -6" stroke="#e9b949" stroke-width="6" fill="none"/></g>`;
    return `<svg viewBox="0 0 ${N*70+20} ${N*70+20}" width="100%">${s}</svg>`};
  panel(`<div class="kp"><div class="kpt">${o.title}</div><div id="crg" class="crg">${draw()}</div>
    <div class="kpg"><span></span><button data-mv="-1,0">▲</button><span></span><button data-mv="0,-1">◀</button><button id="crok">BAJAR</button><button data-mv="0,1">▶</button><span></span><button data-mv="1,0">▼</button><span></span></div><div id="pzm"></div></div>`);
  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const [dr,dc]=b.dataset.mv.split(',').map(Number);
    const nr=r+dr,nc=c+dc;if(nr<0||nc<0||nr>=N||nc>=N)return beep(150);if(wall(nr,nc)){beep(120);return pzBad('¡Choca con un carro!')}
    r=nr;c=nc;beep(500);$('#crg').innerHTML=draw()});
  $('#crok').onclick=ev=>{ev.stopPropagation();(r===o.target[0]&&c===o.target[1])?pzWin('✔ ¡Enganchado!',o.onOK):pzBad('Ahí no hay nada que enganchar')};
}

/* ---------- final del juego ---------- */
function gameFinale(){
  G.over=true;clearInterval(gTick);bub.style.display='none';cap.style.display='none';$('#hud').style.display='none';
  G.f.final=1;saveGame();
  $('#scene').innerHTML=svg(`<rect width="800" height="450" fill="#ffd02e"/><polygon points="${burst(400,225,24,560,340)}" fill="#ff9a2e" ${K}/>
    <g transform="translate(300,380) scale(1.25)" class="juan"><g class="breathe">${chibi({...JUAN,juan:true,expr:'normal'})}</g></g>
    <g transform="translate(500,380) scale(1.25)"><g class="breathe">${jpStand()}</g></g>
    ${txt(400,70,'¡JUAN PABLO ESTÁ A SALVO!',44,'#fff')}`,'#000');
  if(started){[523,659,784,1046].forEach((f,i)=>tone(f,.35,{type:'triangle',g:.2,delay:i*.18}))}
  setTimeout(()=>{
    endScreen(true,'🎉 ¡FIN! 🎉',`Juan Atencia rescató a Juan Pablo de los 5 mundos del Marrano. Juan Pablo se podrá volver a sentar... algún día. Tiempo total: ${fmt(G.t)}. Gracias por jugar.`,
      `<button class="big" id="retry">↺ Jugar desde el principio</button><br><button class="link" id="intro">🎬 Ver la intro</button>`,{retry:()=>startGame(false),intro:begin});
  },5000);
}
/* Juan Pablo de pie (para el final) */
function jpStand(){
  return chibi({juan:false,shirt:'#1b1b1b',pants:'#3a4a6a',skin:JP_SKIN,expr:'normal'}).replace(/<g transform="translate\(0,-130\) scale\(1.12\)">[\s\S]*$/,'')+
    `<g transform="translate(0,-130) scale(1.12)">${headFront({skin:JP_SKIN,hair:'#1a1412',expr:'normal'})}
     <path d="M-30 -18 Q-34 -44 -14 -48 Q-6 -58 8 -50 Q22 -56 30 -40 Q38 -26 30 -10 Q24 -26 10 -28 Q-6 -34 -30 -18Z" fill="#1a1412" ${K}/></g>`;
}

/* ================= MOTOR ================= */
const $=q=>document.querySelector(q);
const stage=$('#stage'),bub=$('#bub'),cap=$('#cap');
let walkT=null,idx=-1,typer=null,autoT=null,lastKey='',clockT=null,started=false,txtEl=null;

function fx(f){
  if(!f)return;
  const el=f==='flicker'?$('#dark'):f==='flash'?$('#flash'):stage;
  const cls=f==='flicker'?'flick':f==='flash'?'on':'shake';
  el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);
}
function finishType(){
  if(typer){clearInterval(typer);typer=null}
  const s=S[idx];if(s&&s.txt&&txtEl)txtEl.textContent=s.txt;
  stage.classList.remove('talk','tk-juan','tk-jp');
}
function go(n){
  idx=n;clearTimeout(autoT);finishType();
  try{speechSynthesis.cancel()}catch(e){}
  const s=S[idx];if(!s)return;
  if(s.final){showFinal();return}
  const key=[s.sc,s.pig,s.tv,s.tvon,s.scared,s.walk,s.jx].join('|');
  if(key!==lastKey){$('#scene').innerHTML=SC[s.sc](s);lastKey=key}
  fx(s.fx);
  if(started&&s.snd)SFX[s.snd]();
  bub.style.display='none';cap.style.display='none';txtEl=null;
  if(s.txt){
    if(s.who){
      const p=s.b||(POS[s.sc]||{})[s.who]||[50,4];
      bub.style.left=p[0]+'%';bub.style.top=p[1]+'%';bub.style.bottom='auto';bub.dataset.w=s.who;
      bub.querySelector('.w').textContent=s.who;bub.style.display='block';txtEl=$('#btx');
    }else{
      cap.classList.remove('low');cap.classList.toggle('center',s.sc==='negro');cap.style.display='block';txtEl=$('#ctx');
    }
    txtEl.textContent='';let k=0;
    if(s.tv==='puppet')stage.classList.add('talk');
    if(s.who==='JUAN')stage.classList.add('tk-juan');
    if(s.who==='JUAN PABLO')stage.classList.add('tk-jp');
    typer=setInterval(()=>{k++;txtEl.textContent=s.txt.slice(0,k);
      if(started&&s.who&&k%2)SFX.type();
      if(k>=s.txt.length)finishType()},30);
    if(started&&s.voice)speak(s.txt);
  }
  clearTimeout(walkT);stage.classList.remove('walking');
  if(s.walk){stage.classList.add('walking');walkT=setTimeout(()=>stage.classList.remove('walking'),WALK_T*1000)}
  if(s.auto)autoT=setTimeout(()=>go(idx+1),s.auto);
}
function next(){
  if(idx<0||$('#final').style.display==='flex')return;
  if(typer){finishType();return}
  go(idx+1);
}
function showFinal(){
  bub.style.display='none';cap.style.display='none';
  $('#scene').innerHTML=SC.sala({scared:1,arrows:1});lastKey='';
  clearInterval(clockT);
  $('#contgame').style.display=readSave()?'':'none';
  $('#final').style.display='flex';
  if(started)SFX.thud();
}
function begin(){
  started=true;ac();startDrone();mode='intro';
  if(G)G.over=true;clearInterval(gTick);cancelAnimationFrame(gRaf);
  ['#title','#final','#end','#hud','#panel'].forEach(q=>$(q).style.display='none');
  $('#skip').style.display='';clearInterval(clockT);
  lastKey='';go(0);
}

stage.addEventListener('click',e=>{
  if(e.target.closest('button')||e.target.closest('#panel'))return;
  if(mode==='game'){if(G&&!G.over)gClick(e);return}
  next();
});
document.addEventListener('keydown',e=>{if(mode!=='game'&&(e.key===' '||e.key==='Enter'||e.key==='ArrowRight')){e.preventDefault();next()}});
$('#play').onclick=begin;
$('#again').onclick=begin;
$('#playgame').onclick=()=>{started=true;ac();startDrone();startGame(false)};
$('#contgame').onclick=()=>{started=true;ac();startDrone();startGame(true)};
$('#contTitle').onclick=()=>{started=true;ac();startDrone();startGame(true)};
(()=>{const sv=readSave();if(sv){let w=1;try{w=JSON.parse(sv.cp).world??1}catch(e){}const b=$('#contTitle');b.style.display='';b.textContent=w?'⏩ Continuar partida (Mundo '+w+')':'⏩ Continuar partida (Cuarto de las Teles)'}})();
$('#pclose').onclick=()=>{$('#panel').style.display='none'};
$('#skip').onclick=()=>{if(idx>=0){clearTimeout(autoT);finishType();try{speechSynthesis.cancel()}catch(e){};go(S.length-1)}};
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:1;if(muted)try{speechSynthesis.cancel()}catch(e){}};

/* estática animada de la tele */
setInterval(()=>{const n=document.getElementById('nzT');if(n)n.setAttribute('seed',Math.random()*999|0)},70);

/* pruebas: #p=N abre directo en el paso N */
window.addEventListener('DOMContentLoaded',()=>{
  const m=location.hash.match(/p=(\d+)/);
  if(m){$('#title').style.display='none';go(+m[1]);finishType()}
  if(location.hash==='#game')startGame(false);
  const w=location.hash.match(/w=(\d+)/);if(w){startGame(false);G.f.hub=1;if(+w[1])startWorld(+w[1]);else goHub()}
});
